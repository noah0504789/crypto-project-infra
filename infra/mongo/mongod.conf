storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # 기본값은 (컨테이너가 보는 RAM - 1GB) / 2 라 인스턴스마다 5.34GB 를 잡았다.
      # 한 호스트에 3-멤버 복제셋을 띄우면 셋이 합쳐 호스트 메모리를 넘긴다.
      cacheSizeGB: 0.5

net:
  bindIp: 0.0.0.0
  unixDomainSocket:
    enabled: false

replication:
  replSetName: rs0

security:
  authorization: enabled
  keyFile: /etc/mongo-keyfile