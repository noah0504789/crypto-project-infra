global:
  scrape_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: 
          - 'node-exporter:9100'
        labels:
          group: 'infra'

  - job_name: 'mysql'
    static_configs:
      - targets: 
          - 'mysql-master-exporter:9104'
          - 'mysql-replica-exporter:9104'
        labels:
          group: 'infra'

  - job_name: 'redis-cluster'
    static_configs:
      - targets:
          - 'redis-exporter-0:9121'
          - 'redis-exporter-1:9121'
          - 'redis-exporter-2:9121'
          - 'redis-exporter-3:9121'
          - 'redis-exporter-4:9121'
          - 'redis-exporter-5:9121'          
        labels: { group: 'infra' }

  - job_name: 'mongo'
    static_configs:
      - targets: 
          - 'mongodb-exporter-primary:9216'
          - 'mongodb-exporter-secondary-0:9216'
          - 'mongodb-exporter-secondary-1:9216'
        labels:
          group: 'infra'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          group: 'infra'

  # blue/green 서비스는 컨테이너 이름이 배포마다 바뀐다(예: crypto-chat-service-blue-1 → -green-1).
  # 그래서 정적 target 대신 Docker 라벨(app=...) 기반 자동 발견을 쓴다.
  # (라벨은 배포 스크립트 bluegreen-core.sh 가 컨테이너에 붙인다.)
  - job_name: 'crypto-chat-service'
    metrics_path: /api/v1/actuator/prometheus
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      # app 라벨이 이 서비스인 컨테이너만
      - source_labels: [__meta_docker_container_label_app]
        regex: crypto-chat-service
        action: keep
      # crypto-project-network 상의 주소만(네트워크당 중복 방지)
      - source_labels: [__meta_docker_network_name]
        regex: crypto-project-network
        action: keep
      # 스크레이프 주소 = 컨테이너 IP : 컨테이너 포트
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: ${1}:8080
      # 컨테이너 이름을 instance 라벨로(앞의 / 제거)
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: instance
      - target_label: group
        replacement: service
      - target_label: service
        replacement: chat-service

  # crypto-outbox-poller: 필요 시 위와 같은 docker_sd 패턴으로 활성화(현재 미사용).

  - job_name: 'crypto-websocket-gateway'
    metrics_path: /actuator/prometheus
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_app]
        regex: crypto-websocket-gateway
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: crypto-project-network
        action: keep
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: ${1}:8100
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: instance
      - target_label: group
        replacement: service
      - target_label: service
        replacement: websocket-service
