services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports: ["19090:9090"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on: [docker-socket-proxy]
    mem_limit: 384m
    networks: [crypto-project-network]

  # docker_sd(서비스 자동 발견)용 Docker API를 읽기 전용(컨테이너 목록만)으로 노출하는 프록시.
  # 이걸 앞에 두면 Prometheus에 docker.sock 직접 마운트·user: root가 필요 없다.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1   # GET /containers/json (docker_sd 컨테이너 목록)
      - NETWORKS=1     # GET /networks (docker_sd 네트워크 라벨 계산)
      - POST=0         # 쓰기(POST) API 차단
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    networks: [crypto-project-network]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning/datasources
    # depends_on: [prometheus]
    mem_limit: 256m
    networks: [crypto-project-network]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - "--path.rootfs=/host"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.filesystem"
      - "--collector.loadavg"
      - "--collector.netdev"
      - "--collector.stat"
    volumes:
      - /:/host:ro
    mem_limit: 64m
    restart: unless-stopped
    networks: [crypto-project-network]

  mysql-primary-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-primary-exporter
    command:
      - "--mysqld.address=mysql-master:3306"
      - "--mysqld.username=${MYSQL_EXPORTER_USER}"
      - "--collect.global_status"
      - "--collect.global_variables"
      - "--collect.info_schema.processlist"
      - "--collect.info_schema.tables"
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD}
    mem_limit: 64m
    networks: [crypto-project-network]

  mysql-replica-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-replica-exporter
    command:
      - "--mysqld.address=mysql-replica:3306"
      - "--mysqld.username=${MYSQL_EXPORTER_USER}"
      - "--collect.global_status"
      - "--collect.global_variables"
      - "--collect.info_schema.processlist"
      - "--collect.info_schema.tables"
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD}
    mem_limit: 64m
    networks: [crypto-project-network]

  redis-exporter-0:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-0
    command:
      - "--redis.addr=redis://redis-0:7100"
      - "--is-cluster"
    networks: [crypto-project-network]

  redis-exporter-1:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-1
    command:
      - "--redis.addr=redis://redis-1:7101"
      - "--is-cluster"
    networks: [crypto-project-network]

  redis-exporter-2:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-2
    command:
      - "--redis.addr=redis://redis-2:7102"
      - "--is-cluster"
    networks: [crypto-project-network]

  redis-exporter-3:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-3
    command:
      - "--redis.addr=redis://redis-3:7103"
      - "--is-cluster"
    networks: [crypto-project-network]

  redis-exporter-4:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-4
    command:
      - "--redis.addr=redis://redis-4:7104"
      - "--is-cluster"
    networks: [crypto-project-network]

  redis-exporter-5:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-5
    command:
      - "--redis.addr=redis://redis-5:7105"
      - "--is-cluster"
    networks: [crypto-project-network]

  mongodb-exporter-primary:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter-primary
    environment:
      - MONGODB_URI=mongodb://${MONGO_EXPORTER_USER}:${MONGO_EXPORTER_PASSWORD}@mongo-primary:27017/?authSource=admin&directConnection=true
    command:
      - "--collect-all"
      - "--compatible-mode"
    networks: [crypto-project-network]

  mongodb-exporter-secondary-0:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter-secondary-0
    environment:
      - MONGODB_URI=mongodb://${MONGO_EXPORTER_USER}:${MONGO_EXPORTER_PASSWORD}@mongo-secondary-0:27017/?authSource=admin&directConnection=true
    command:
      - "--collect-all"
      - "--compatible-mode"
    networks: [crypto-project-network]

  mongodb-exporter-secondary-1:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter-secondary-1
    environment:
      - MONGODB_URI=mongodb://${MONGO_EXPORTER_USER}:${MONGO_EXPORTER_PASSWORD}@mongo-secondary-1:27017/?authSource=admin&directConnection=true
    command:
      - "--collect-all"
      - "--compatible-mode"
    networks: [crypto-project-network]

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - "--kafka.server=kafka-0:9092"
      - "--kafka.server=kafka-1:9092"
    networks: [crypto-project-network]

networks:
  crypto-project-network:
    external: true

volumes:
  grafana-data:
    external: true
