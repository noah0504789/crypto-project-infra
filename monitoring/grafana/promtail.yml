server:
  http_listen_port: 3100

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
    pipeline_stages:
      - docker
      - json:
          expressions:
            level: level
            logger: logger
            trace_id: trace_id
            span_id: span_id
            message: message
      - labels:
          service:
          container:
          level:
          logger:
          trace_id:
      - output:
          source: message

  - job_name: app-files
    static_configs:
      - targets: [localhost]
        labels:
          job: app
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            message: message
            trace_id: trace_id
            span_id: span_id
      - timestamp:
          source: time
          format: RFC3339           # 예: 2025-09-20T03:00:12Z
      - labels:
          level:
          trace_id:
          span_id:
      - output:
          source: message